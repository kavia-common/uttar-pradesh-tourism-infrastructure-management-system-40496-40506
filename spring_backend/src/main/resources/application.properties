# Server
server.port=${SERVER_PORT:8080}

# DataSource - PostgreSQL on port 5001 (preview environment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5001/myapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Use 'validate' when schema is pre-initialized; switch to 'update' during development if needed.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Multipart (file uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Security / JWT
# Reads JWT secret from environment variable APP_JWT_SECRET (Base64 allowed; plain text supported).
app.security.jwt.secret=${APP_JWT_SECRET:please-change-secret}
app.security.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# CORS allowed origin for Angular dev
# Ensure Authorization header is exposed and credentials are allowed (configured in SecurityConfig).
app.security.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Springdoc OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
